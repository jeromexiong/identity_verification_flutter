name: identity_verification_flutter
description: "腾讯身份认证 H5 刷脸桥接 Flutter 插件（放心签 faceIntegrate / 腾讯慧眼 H5 WebView）"
version: 0.1.0
homepage: https://github.com/jeromexiong/identity_verification_flutter
repository: https://github.com/jeromexiong/identity_verification_flutter
issue_tracker: https://github.com/jeromexiong/identity_verification_flutter/issues

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  identity_verification_flutter_platform_interface: ^0.1.0
  identity_verification_flutter_android: ^0.1.0
  identity_verification_flutter_ios: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  plugin_platform_interface: ^2.0.2

flutter:
  plugin:
    platforms:
      android:
        default_package: identity_verification_flutter_android
      ios:
        default_package: identity_verification_flutter_ios
