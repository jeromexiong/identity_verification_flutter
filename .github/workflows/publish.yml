name: publish

on:
  push:
    tags:
      - "v*"

env:
  PACKAGES: >-
    identity_verification_flutter_platform_interface
    identity_verification_flutter_android
    identity_verification_flutter_ios
    identity_verification_flutter

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require tag on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tags must point to a commit reachable from main"
            exit 1
          fi

  test:
    needs: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        package:
          - identity_verification_flutter_platform_interface
          - identity_verification_flutter_android
          - identity_verification_flutter_ios
          - identity_verification_flutter
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: flutter test

  publish:
    needs: [verify-tag, test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dart-lang/setup-dart@v1

      - name: Authenticate to pub.dev
        run: dart pub token add https://pub.dev --env PUB_TOKEN
        env:
          PUB_TOKEN: ${{ secrets.PUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare pubspecs (remove publish_to, swap path deps)
        run: |
          VER="${{ steps.version.outputs.VERSION }}"
          for pkg in identity_verification_flutter_platform_interface \
                     identity_verification_flutter_android \
                     identity_verification_flutter_ios \
                     identity_verification_flutter; do
            # 移除 publish_to: none
            sed -i '/^publish_to: none/d' "$pkg/pubspec.yaml"
            # 替换 path 依赖为版本号
            sed -i "s|path: ../identity_verification_flutter_platform_interface|^${VER}|" "$pkg/pubspec.yaml"
            sed -i "s|path: ../identity_verification_flutter_android|^${VER}|" "$pkg/pubspec.yaml"
            sed -i "s|path: ../identity_verification_flutter_ios|^${VER}|" "$pkg/pubspec.yaml"
          done

      # ── 发布 platform_interface（无内部依赖）──
      - name: Publish platform_interface
        working-directory: identity_verification_flutter_platform_interface
        run: |
          dart pub get
          yes | dart pub publish

      # ── 发布 android（依赖 platform_interface）──
      - name: Publish android
        working-directory: identity_verification_flutter_android
        run: |
          dart pub get
          yes | dart pub publish

      # ── 发布 ios（依赖 platform_interface）──
      - name: Publish ios
        working-directory: identity_verification_flutter_ios
        run: |
          dart pub get
          yes | dart pub publish

      # ── 发布 app-facing（依赖所有子包）──
      - name: Publish app-facing
        working-directory: identity_verification_flutter
        run: |
          dart pub get
          yes | dart pub publish
