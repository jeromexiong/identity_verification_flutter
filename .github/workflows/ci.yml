name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        package:
          - identity_verification_flutter_platform_interface
          - identity_verification_flutter_android
          - identity_verification_flutter_ios
          - identity_verification_flutter
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ matrix.package }}
        run: flutter analyze --no-fatal-infos

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        package:
          - identity_verification_flutter_platform_interface
          - identity_verification_flutter_android
          - identity_verification_flutter_ios
          - identity_verification_flutter
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: flutter pub get
      - name: Run tests
        working-directory: ${{ matrix.package }}
        run: flutter test

  # 原生平台构建验证（example 在 app-facing 包内）
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: identity_verification_flutter/example
        run: flutter pub get
      - name: Build APK
        working-directory: identity_verification_flutter/example
        run: flutter build apk --debug

  build-ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        working-directory: identity_verification_flutter/example
        run: flutter pub get
      - name: Build iOS
        working-directory: identity_verification_flutter/example
        run: flutter build ios --debug --no-codesign
