group = "com.transcend.qiyun.tencent_identity_verification"
version = "0.0.5"

apply plugin: "com.android.library"

android {
    namespace = "com.transcend.qiyun.tencent_identity_verification"
    compileSdk = 34

    defaultConfig {
        minSdk = 21
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

// Built-in Kotlin（Flutter 3.44+ 新标准）：移除 kotlin-android 插件，KGP 由 AGP 9 + Flutter 提供
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // H5FaceVerifyActivity 主题依赖 appcompat（Theme.AppCompat.Light.NoActionBar）
    implementation "androidx.appcompat:appcompat:1.7.0"
}